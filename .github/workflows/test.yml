name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt pytest-cov

      - name: Crea .env di test
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY || 'chiave-di-test-lunga-almeno-32-caratteri-per-ci' }}" >> .env
          echo "DATABASE_URL=sqlite:///./test_ci.db" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "ENV=development" >> .env

      - name: Esegui pytest con coverage
        run: |
          pytest --cov=. \
                 --cov-report=term-missing \
                 --cov-fail-under=70 \
                 -v