name: Tests and Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: pytest coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt pytest-cov

      - name: Crea env
        run: |
          echo "SECRET_KEY=chiave-di-test-lunga-almeno-32-caratteri-per-ci" >> .env
          echo "DATABASE_URL=sqlite:///./test_ci.db" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "ENV=development" >> .env

      - name: Esegui pytest
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70 -v
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true